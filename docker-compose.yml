services:
  app:
    container_name: chedu
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "10080:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backend/.env:/app/.env
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/routes.db
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGIN=*
